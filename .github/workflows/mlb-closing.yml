name: MLB Closing Line Snapshot

on:
  schedule:
    - cron: '45 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-board
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Write scripts
        run: |
          mkdir -p mlb data/mlb
          cat > mlb/core.py <<'PYEOF'
          """
          MLB Board — shared core.
          De-vig, market consensus, HR model, team/park tables, name matching.
          No I/O here beyond plain HTTP helpers, so it can be unit-tested offline.
          """
          import csv
          import difflib
          import json
          import math
          import os
          import re
          import sys
          import time
          import unicodedata
          from datetime import datetime, timedelta, timezone

          import requests

          UA = {"User-Agent": "mlb-board/1.0 (+github actions)"}


          # ---------------------------------------------------------------- http

          def get_json(url, params=None, tries=3, timeout=30, headers=None):
              """GET returning (json_or_None, status_code, response_headers)."""
              h = dict(UA)
              if headers:
                  h.update(headers)
              last = 0
              for i in range(tries):
                  try:
                      r = requests.get(url, params=params, headers=h, timeout=timeout)
                      last = r.status_code
                      if r.status_code == 200:
                          return r.json(), 200, r.headers
                      # 4xx other than 429 will not fix themselves
                      if 400 <= r.status_code < 500 and r.status_code != 429:
                          print(f"    HTTP {r.status_code} {url} :: {r.text[:220]}")
                          return None, r.status_code, r.headers
                      print(f"    HTTP {r.status_code} {url} (attempt {i+1}/{tries})")
                  except Exception as e:
                      print(f"    ERR {type(e).__name__}: {e} {url} (attempt {i+1}/{tries})")
                      last = -1
                  time.sleep(1.5 * (i + 1))
              return None, last, {}


          # ---------------------------------------------------------------- de-vig

          def shin_devig(quoted):
              """
              Shin (1993) de-vig for an n-outcome market.
              `quoted` = list of implied probabilities (1/decimal_odds), booksum > 1.
              Returns fair probabilities summing to 1.

              Shin models the overround as protection against insider trading, which
              puts proportionally more of the margin on longshots. Proportional
              de-vig (just dividing by the booksum) overstates longshot fair value —
              which matters a lot here, because every home-run prop is a longshot.
              """
              q = [max(x, 1e-9) for x in quoted]
              s = sum(q)
              if s <= 1.0 or len(q) < 2:
                  return [x / s for x in q]

              def probs(z):
                  z = min(max(z, 1e-9), 0.9999)
                  out = []
                  for qi in q:
                      root = math.sqrt(max(z * z + 4.0 * (1.0 - z) * qi * qi / s, 0.0))
                      out.append((root - z) / (2.0 * (1.0 - z)))
                  return out

              lo, hi = 0.0, 0.9
              for _ in range(80):
                  mid = (lo + hi) / 2.0
                  if sum(probs(mid)) > 1.0:
                      lo = mid
                  else:
                      hi = mid
              p = probs((lo + hi) / 2.0)
              tot = sum(p)
              return [x / tot for x in p] if tot > 0 else [x / s for x in q]


          def median(xs):
              xs = sorted(xs)
              n = len(xs)
              if n == 0:
                  return None
              if n % 2:
                  return xs[n // 2]
              return 0.5 * (xs[n // 2 - 1] + xs[n // 2])


          def american(dec):
              """Decimal -> American, for display."""
              if dec is None:
                  return ""
              if dec >= 2.0:
                  return f"+{round((dec - 1) * 100):d}"
              return f"-{round(100 / (dec - 1)):d}"


          # ---------------------------------------------------------------- teams / parks

          # MLB Stats API team id -> (abbrev, Odds API display name)
          TEAMS = {
              108: ("LAA", "Los Angeles Angels"),
              109: ("ARI", "Arizona Diamondbacks"),
              110: ("BAL", "Baltimore Orioles"),
              111: ("BOS", "Boston Red Sox"),
              112: ("CHC", "Chicago Cubs"),
              113: ("CIN", "Cincinnati Reds"),
              114: ("CLE", "Cleveland Guardians"),
              115: ("COL", "Colorado Rockies"),
              116: ("DET", "Detroit Tigers"),
              117: ("HOU", "Houston Astros"),
              118: ("KC", "Kansas City Royals"),
              119: ("LAD", "Los Angeles Dodgers"),
              120: ("WSH", "Washington Nationals"),
              121: ("NYM", "New York Mets"),
              133: ("ATH", "Athletics"),
              134: ("PIT", "Pittsburgh Pirates"),
              135: ("SD", "San Diego Padres"),
              136: ("SEA", "Seattle Mariners"),
              137: ("SF", "San Francisco Giants"),
              138: ("STL", "St. Louis Cardinals"),
              139: ("TB", "Tampa Bay Rays"),
              140: ("TEX", "Texas Rangers"),
              141: ("TOR", "Toronto Blue Jays"),
              142: ("MIN", "Minnesota Twins"),
              143: ("PHI", "Philadelphia Phillies"),
              144: ("ATL", "Atlanta Braves"),
              145: ("CWS", "Chicago White Sox"),
              146: ("MIA", "Miami Marlins"),
              147: ("NYY", "New York Yankees"),
              158: ("MIL", "Milwaukee Brewers"),
          }

          # Approximate multi-year Statcast HOME RUN park factors, 100 = league average.
          # These feed the reference model only, never the picks. Refresh yearly from
          # baseballsavant.mlb.com/leaderboard/statcast-park-factors (stat = HR).
          PARK_HR = {
              "CIN": 117, "NYY": 114, "COL": 112, "PHI": 112, "CWS": 111, "ATH": 110,
              "MIL": 108, "LAD": 107, "TEX": 106, "TOR": 105, "LAA": 104, "ARI": 103,
              "CHC": 103, "ATL": 103, "WSH": 103, "BAL": 102, "HOU": 101, "NYM": 100,
              "CLE": 100, "MIN": 99, "BOS": 98, "PIT": 96, "DET": 95, "SEA": 95,
              "SD": 95, "STL": 95, "TB": 99, "MIA": 93, "KC": 92, "SF": 90,
          }


          def norm_team(s):
              s = (s or "").lower()
              s = re.sub(r"[^a-z ]", "", s)
              return " ".join(s.split())


          TEAM_BY_NAME = {}
          for _tid, (_ab, _nm) in TEAMS.items():
              TEAM_BY_NAME[norm_team(_nm)] = _tid
          # Odds API / statsapi spelling drift
          for _alias, _tid in {
              "oakland athletics": 133, "athletics": 133, "las vegas athletics": 133,
              "st louis cardinals": 138, "saint louis cardinals": 138,
              "chicago white sox": 145, "washington nationals": 120,
              "arizona diamondbacks": 109, "cleveland guardians": 114,
          }.items():
              TEAM_BY_NAME[norm_team(_alias)] = _tid


          def team_id_from_name(name):
              n = norm_team(name)
              if n in TEAM_BY_NAME:
                  return TEAM_BY_NAME[n]
              # last-word match ("Yankees", "Blue Jays")
              best, score = None, 0.0
              for k, tid in TEAM_BY_NAME.items():
                  r = difflib.SequenceMatcher(None, n, k).ratio()
                  if r > score:
                      best, score = tid, r
              return best if score >= 0.62 else None


          # ---------------------------------------------------------------- player names

          SUFFIXES = {"jr", "sr", "ii", "iii", "iv", "v"}


          def norm_person(name):
              s = unicodedata.normalize("NFKD", name or "")
              s = "".join(c for c in s if not unicodedata.combining(c))
              s = s.lower().replace(".", " ").replace("'", "").replace("-", " ")
              s = re.sub(r"[^a-z ]", " ", s)
              parts = [p for p in s.split() if p and p not in SUFFIXES]
              return " ".join(parts)


          def match_player(name, candidates):
              """
              candidates: dict normalised_name -> player_id, restricted to the two
              rosters actually in this game. Small candidate pool is what makes a
              string match safe here.
              """
              n = norm_person(name)
              if n in candidates:
                  return candidates[n], 1.0
              # last name + first initial
              parts = n.split()
              if len(parts) >= 2:
                  key = parts[0][0] + " " + parts[-1]
                  for cn, pid in candidates.items():
                      cp = cn.split()
                      if len(cp) >= 2 and cp[0][0] + " " + cp[-1] == key:
                          return pid, 0.9
              best, score = None, 0.0
              for cn, pid in candidates.items():
                  r = difflib.SequenceMatcher(None, n, cn).ratio()
                  if r > score:
                      best, score = pid, r
              return (best, score) if score >= 0.82 else (None, score)


          # ---------------------------------------------------------------- HR model

          LG_HR_PER_PA_FALLBACK = 0.0310   # ~3.1% of PA end in a home run
          BAT_SHRINK_PA = 250.0
          PIT_SHRINK_BF = 300.0
          STARTER_SHARE = 0.62             # share of a lineup's PA that face the starter
          SLOT_PA = {1: 4.62, 2: 4.52, 3: 4.42, 4: 4.32, 5: 4.20,
                     6: 4.08, 7: 3.96, 8: 3.84, 9: 3.72}
          DEFAULT_PA = 4.15


          def hr_model_prob(bat_hr, bat_pa, pit_hr, pit_bf, park_idx, lg_rate, slot=None):
              """
              P(batter hits >= 1 HR) via a shrunk log5 rate combination.

              Deliberately simple. Its job is to give the board a second opinion and
              flag disagreement, not to price anything. Every backtest in the football
              build said the same thing: the model loses to the closing line, so the
              closing line prices the board.
              """
              lg = lg_rate or LG_HR_PER_PA_FALLBACK
              rb = (bat_hr + BAT_SHRINK_PA * lg) / (bat_pa + BAT_SHRINK_PA)
              rp = (pit_hr + PIT_SHRINK_BF * lg) / (pit_bf + PIT_SHRINK_BF)
              # starter for ~62% of PA, league-average relief for the rest
              rp_eff = STARTER_SHARE * rp + (1.0 - STARTER_SHARE) * lg
              rate = (rb * rp_eff / lg) * (park_idx / 100.0)
              rate = min(max(rate, 0.0005), 0.25)
              pa = SLOT_PA.get(slot, DEFAULT_PA)
              return 1.0 - (1.0 - rate) ** pa


          # ---------------------------------------------------------------- misc

          def eastern_date(dt_utc=None):
              """US Eastern calendar date. MLB's 'game day' is an Eastern date."""
              dt = dt_utc or datetime.now(timezone.utc)
              # EDT (Mar-Nov) is UTC-4; EST is UTC-5. Season runs inside EDT.
              off = -4 if 3 <= dt.month <= 11 else -5
              return (dt + timedelta(hours=off)).date()


          def date_from_iso(s):
              from datetime import date as _d
              y, m, d = (s or "1970-01-01").split("-")[:3]
              return _d(int(y), int(m), int(d))


          def ensure_csv(path, header):
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              if not os.path.exists(path):
                  with open(path, "w", newline="", encoding="utf-8") as f:
                      csv.writer(f).writerow(header)


          def append_csv(path, header, rows):
              ensure_csv(path, header)
              with open(path, "a", newline="", encoding="utf-8") as f:
                  w = csv.writer(f)
                  for r in rows:
                      w.writerow([r.get(h, "") for h in header])


          def read_csv(path):
              if not os.path.exists(path):
                  return []
              with open(path, "r", newline="", encoding="utf-8-sig") as f:
                  return list(csv.DictReader(f))


          def write_csv(path, header, rows):
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, "w", newline="", encoding="utf-8") as f:
                  w = csv.writer(f)
                  w.writerow(header)
                  for r in rows:
                      w.writerow([r.get(h, "") for h in header])
          PYEOF
          cat > mlb/feeds.py <<'PYEOF'
          """
          MLB Board — data feeds.
          statsapi.mlb.com (free, no key, reachable from Actions) supplies schedule,
          probable pitchers, rosters, season rates and final results.
          The Odds API supplies prices.
          """
          from datetime import datetime, timezone

          from core import (TEAMS, get_json, norm_person, team_id_from_name)

          STATS = "https://statsapi.mlb.com/api/v1"
          ODDS = "https://api.the-odds-api.com/v4"
          SPORT = "baseball_mlb"


          # ---------------------------------------------------------------- statsapi

          def schedule(date_str):
              """All MLB games on a US-Eastern date, with probable pitchers + lineups."""
              j, code, _ = get_json(
                  f"{STATS}/schedule",
                  {"sportId": 1, "date": date_str,
                   "hydrate": "probablePitcher,team,linescore,lineups"},
              )
              print(f"  schedule {date_str}: HTTP {code}")
              if not j:
                  return []
              games = []
              for d in j.get("dates", []):
                  for g in d.get("games", []):
                      if g.get("gameType") not in ("R", "F", "D", "L", "W"):
                          continue
                      h = g["teams"]["home"]
                      a = g["teams"]["away"]
                      games.append({
                          "gamePk": g["gamePk"],
                          "gameDate": g.get("gameDate"),
                          "state": g.get("status", {}).get("abstractGameState"),
                          "detailed": g.get("status", {}).get("detailedState"),
                          "home_id": h["team"]["id"],
                          "away_id": a["team"]["id"],
                          "home_name": h["team"]["name"],
                          "away_name": a["team"]["name"],
                          "home_score": h.get("score"),
                          "away_score": a.get("score"),
                          "home_sp": (h.get("probablePitcher") or {}).get("id"),
                          "away_sp": (a.get("probablePitcher") or {}).get("id"),
                          "home_sp_name": (h.get("probablePitcher") or {}).get("fullName"),
                          "away_sp_name": (a.get("probablePitcher") or {}).get("fullName"),
                          "lineups": g.get("lineups") or {},
                          "venue": (g.get("venue") or {}).get("name"),
                      })
              print(f"  schedule {date_str}: {len(games)} games")
              return games


          def season_stats(season, group):
              """Every player's season line. group = 'hitting' | 'pitching'."""
              out, offset, limit = {}, 0, 1000
              while True:
                  j, code, _ = get_json(
                      f"{STATS}/stats",
                      {"stats": "season", "group": group, "season": season,
                       "sportId": 1, "limit": limit, "offset": offset,
                       "playerPool": "All"},
                  )
                  if not j:
                      print(f"  season {group}: HTTP {code} at offset {offset}")
                      break
                  splits = []
                  for blk in j.get("stats", []):
                      splits.extend(blk.get("splits", []))
                  for s in splits:
                      pid = (s.get("player") or {}).get("id")
                      if pid:
                          out[pid] = s.get("stat", {})
                  if len(splits) < limit:
                      break
                  offset += limit
                  if offset > 6000:
                      break
              print(f"  season {group} {season}: {len(out)} players")
              return out


          def roster(team_id):
              j, code, _ = get_json(f"{STATS}/teams/{team_id}/roster",
                                    {"rosterType": "active"})
              if not j:
                  print(f"  roster {team_id}: HTTP {code}")
                  return {}
              out = {}
              for e in j.get("roster", []):
                  p = e.get("person", {})
                  if p.get("id"):
                      out[norm_person(p.get("fullName"))] = p["id"]
              return out


          def boxscore_hr(game_pk):
              """{player_id: home_runs} for a finished game."""
              j, code, _ = get_json(f"{STATS}/game/{game_pk}/boxscore")
              if not j:
                  print(f"  boxscore {game_pk}: HTTP {code}")
                  return None
              out = {}
              for side in ("home", "away"):
                  for key, pl in (j.get("teams", {}).get(side, {})
                                  .get("players", {}) or {}).items():
                      pid = pl.get("person", {}).get("id")
                      bat = (pl.get("stats", {}) or {}).get("batting", {}) or {}
                      if pid is not None and "homeRuns" in bat:
                          out[pid] = int(bat.get("homeRuns") or 0)
              return out


          def league_hr_rate(hitting):
              hr = sum(int(s.get("homeRuns") or 0) for s in hitting.values())
              pa = sum(int(s.get("plateAppearances") or 0) for s in hitting.values())
              return (hr / pa) if pa > 5000 else None


          # ---------------------------------------------------------------- odds api

          class Odds:
              def __init__(self, key, regions="us,us2"):
                  self.key = key
                  self.regions = regions
                  self.remaining = None
                  self.used = None

              def _note(self, headers):
                  try:
                      self.remaining = int(headers.get("x-requests-remaining", -1))
                      self.used = int(headers.get("x-requests-used", -1))
                  except Exception:
                      pass

              def events(self):
                  """Free endpoint (0 credits): upcoming events with ids + start times."""
                  j, code, h = get_json(f"{ODDS}/sports/{SPORT}/events",
                                        {"apiKey": self.key})
                  self._note(h)
                  print(f"  odds events: HTTP {code}, {len(j or [])} events, "
                        f"credits left {self.remaining}")
                  return j or []

              def moneylines(self):
                  """One call for the whole sport. Cost = 1 market x regions."""
                  j, code, h = get_json(
                      f"{ODDS}/sports/{SPORT}/odds",
                      {"apiKey": self.key, "regions": self.regions,
                       "markets": "h2h", "oddsFormat": "decimal"},
                  )
                  self._note(h)
                  print(f"  odds h2h: HTTP {code}, {len(j or [])} events, "
                        f"credits left {self.remaining}")
                  return j or []

              def hr_props(self, event_id):
                  """Cost = 1 market x regions, per event."""
                  j, code, h = get_json(
                      f"{ODDS}/sports/{SPORT}/events/{event_id}/odds",
                      {"apiKey": self.key, "regions": self.regions,
                       "markets": "batter_home_runs", "oddsFormat": "decimal"},
                  )
                  self._note(h)
                  if code != 200:
                      print(f"    props {event_id}: HTTP {code}")
                  return j


          def event_start(ev):
              try:
                  return datetime.fromisoformat(
                      ev["commence_time"].replace("Z", "+00:00"))
              except Exception:
                  return datetime.now(timezone.utc)


          def link_events_to_games(events, games):
              """
              Pair Odds API events with statsapi games by (home team, away team).
              Team identity is resolved to a stable MLB team id on both sides first,
              so a rename or a nickname-only spelling can't break the pairing.
              """
              by_pair = {}
              for g in games:
                  by_pair[(g["home_id"], g["away_id"])] = g
              linked, misses = [], []
              for ev in events:
                  h = team_id_from_name(ev.get("home_team"))
                  a = team_id_from_name(ev.get("away_team"))
                  g = by_pair.get((h, a))
                  if g is None:
                      misses.append(f"{ev.get('away_team')} @ {ev.get('home_team')}")
                      continue
                  linked.append((ev, g))
              if misses:
                  print(f"  unlinked events ({len(misses)}): {'; '.join(misses[:6])}")
              return linked
          PYEOF
          cat > mlb/board.py <<'PYEOF'
          """
          MLB Board — daily build.

          Runs 14:00 UTC = 10pm Singapore = 10am US Eastern, ahead of that day's slate.

          Output
            2 x 3-leg home-run parlays  (the likeliest bats)
            2 x 4-leg home-run parlays  (reaching further down for price)
            Moneyline pick for every game on the slate

          Pricing philosophy, carried over from the football build: the board is
          priced off market consensus, not off the model. The model is computed,
          printed next to every pick, and never allowed to choose one.
          """
          import json
          import os
          import sys
          from datetime import datetime, timedelta, timezone

          import core as C
          import feeds as F

          DATA = "data/mlb"      # namespaced: the football board owns data/
          PICKS = f"{DATA}/picks.csv"
          RESULTS = f"{DATA}/results.csv"
          BOARD_MD = f"{DATA}/board_latest.md"

          PICK_HEADER = [
              "board_date", "logged_at", "market", "game_pk", "matchup", "selection",
              "team", "opp_sp", "best_price", "best_book", "fair_prob", "model_prob",
              "n_books", "edge_pct", "parlay", "closing_price", "clv_pct", "result",
          ]
          RESULT_HEADER = ["board_date", "market", "matchup", "selection",
                           "best_price", "fair_prob", "result", "graded_at"]

          MIN_BOOKS = 4
          MIN_PRICE = 2.20
          MAX_PRICE = 15.00
          PARLAY_SHAPE = [("Parlay 1", 3), ("Parlay 2", 3), ("Parlay 3", 4), ("Parlay 4", 4)]


          # ================================================================ consensus

          def consensus_two_way(pairs):
              """
              pairs: list of (over_decimal, under_decimal) per book, both sides present.
              Returns median Shin-de-vigged P(over).
              """
              ps = []
              for o, u in pairs:
                  if not o or not u or o <= 1.0 or u <= 1.0:
                      continue
                  fair = C.shin_devig([1.0 / o, 1.0 / u])
                  ps.append(fair[0])
              return C.median(ps) if ps else None


          def collect_hr_selections(ev_odds, game, rosters, hitting, pitching, lg_rate):
              """One dict per player with a home-run price in this game."""
              if not ev_odds:
                  return []
              park = C.PARK_HR.get(C.TEAMS.get(game["home_id"], ("", ""))[0], 100)

              # lineup slots, when MLB has posted them (often not yet at 10am ET)
              slots = {}
              for side in ("home", "away"):
                  for i, p in enumerate((game.get("lineups") or {})
                                        .get(f"{side}Players", []) or []):
                      if p.get("id"):
                          slots[p["id"]] = i + 1

              # player -> {book: {"over": price, "under": price}}
              quotes = {}
              for bk in ev_odds.get("bookmakers", []) or []:
                  bkey = bk.get("key", "?")
                  for mk in bk.get("markets", []) or []:
                      if mk.get("key") != "batter_home_runs":
                          continue
                      for oc in mk.get("outcomes", []) or []:
                          if abs(float(oc.get("point") or 0.5) - 0.5) > 1e-6:
                              continue          # skip alt lines (1.5 HR etc)
                          who = oc.get("description")
                          side = (oc.get("name") or "").lower()
                          price = oc.get("price")
                          if not who or side not in ("over", "under") or not price:
                              continue
                          quotes.setdefault(who, {}).setdefault(bkey, {})[side] = float(price)

              home_ab = C.TEAMS.get(game["home_id"], ("?",))[0]
              away_ab = C.TEAMS.get(game["away_id"], ("?",))[0]
              cand = dict(rosters.get(game["home_id"], {}))
              cand.update(rosters.get(game["away_id"], {}))
              home_ids = set(rosters.get(game["home_id"], {}).values())

              out = []
              for who, books in quotes.items():
                  overs = [b["over"] for b in books.values() if "over" in b]
                  two_way = [(b["over"], b["under"]) for b in books.values()
                             if "over" in b and "under" in b]
                  if len(overs) < MIN_BOOKS:
                      continue
                  best_price = max(overs)
                  best_book = max(books.items(), key=lambda kv: kv[1].get("over", 0))[0]
                  fair = consensus_two_way(two_way) if len(two_way) >= 3 else None

                  pid, conf = C.match_player(who, cand)
                  if pid is None:
                      print(f"    unmatched batter '{who}' in {away_ab}@{home_ab} "
                            f"(best ratio {conf:.2f})")
                  is_home = pid in home_ids if pid else None
                  team = home_ab if is_home else away_ab
                  opp_sp = game["away_sp"] if is_home else game["home_sp"]
                  opp_sp_name = (game["away_sp_name"] if is_home
                                 else game["home_sp_name"]) or "TBD"

                  bs = hitting.get(pid, {}) if pid else {}
                  ps = pitching.get(opp_sp, {}) if opp_sp else {}
                  model = C.hr_model_prob(
                      bat_hr=float(bs.get("homeRuns") or 0),
                      bat_pa=float(bs.get("plateAppearances") or 0),
                      pit_hr=float(ps.get("homeRuns") or 0),
                      pit_bf=float(ps.get("battersFaced") or 0),
                      park_idx=park,
                      lg_rate=lg_rate,
                      slot=slots.get(pid),
                  )
                  out.append({
                      "player": who, "player_id": pid, "team": team,
                      "matchup": f"{away_ab} @ {home_ab}",
                      "game_pk": game["gamePk"], "opp_sp": opp_sp_name,
                      "best_price": best_price, "best_book": best_book,
                      "n_books": len(overs), "two_way": len(two_way),
                      "median_over": C.median(overs),
                      "fair": fair, "fair_estimated": False,
                      "model": model, "park": park,
                      "slot": slots.get(pid),
                  })
              return out


          def fill_estimated_fair(sels):
              """
              Books that quote home runs one-sided can't be de-vigged directly.
              Measure the day's own typical fair/implied ratio from the two-sided
              selections and apply it to the rest, rather than guessing a margin.
              """
              ratios = []
              for s in sels:
                  if s["fair"] and s["median_over"]:
                      ratios.append(s["fair"] * s["median_over"])
              ratio = C.median(ratios) or 0.93
              n = 0
              for s in sels:
                  if s["fair"] is None and s["median_over"]:
                      s["fair"] = min(0.98, ratio / s["median_over"])
                      s["fair_estimated"] = True
                      n += 1
              print(f"  fair-value margin ratio {ratio:.4f}; "
                    f"estimated for {n} one-sided selections")
              return ratio


          # ================================================================ parlays

          def build_parlays(pool):
              """
              Rank by consensus hit probability, then slice.

              Ranking by *edge* would silently fill the board with longshots — a 3%
              edge is far easier to find at 12.00 than at 3.50. Ranking by hit
              probability keeps the 3-leggers genuinely the likeliest bats, which is
              what they're for.
              """
              ranked = sorted(pool, key=lambda s: -s["fair"])
              parlays, seen, cur = [], set(), 0
              for name, n in PARLAY_SHAPE:
                  legs, games, wrapped = [], set(), False
                  while len(legs) < n:
                      if cur >= len(ranked):
                          if wrapped:
                              break                # genuinely nothing left to take
                          cur, wrapped = 0, True   # reuse strong bats rather than drop legs
                      s = ranked[cur]
                      cur += 1
                      if s["game_pk"] in games:
                          continue                 # never two legs from one game
                      legs.append(s)
                      games.add(s["game_pk"])
                  key = frozenset(id(s) for s in legs)
                  if not legs or key in seen:
                      continue                     # a thin slate is better served by
                  seen.add(key)                    # fewer tickets than identical ones
                  parlays.append((name, legs))
              return parlays


          def parlay_price(legs):
              p = 1.0
              for s in legs:
                  p *= s["best_price"]
              return p


          def parlay_prob(legs):
              p = 1.0
              for s in legs:
                  p *= s["fair"]
              return p


          # ================================================================ moneyline

          def moneyline_picks(ml_events, linked_by_event):
              picks = []
              for ev in ml_events:
                  g = linked_by_event.get(ev.get("id"))
                  if not g:
                      continue
                  home, away = ev.get("home_team"), ev.get("away_team")
                  per_book, best = [], {}
                  for bk in ev.get("bookmakers", []) or []:
                      m = next((m for m in bk.get("markets", []) or []
                                if m.get("key") == "h2h"), None)
                      if not m:
                          continue
                      o = {x.get("name"): float(x.get("price") or 0)
                           for x in m.get("outcomes", []) or []}
                      if o.get(home, 0) > 1 and o.get(away, 0) > 1:
                          fair = C.shin_devig([1.0 / o[home], 1.0 / o[away]])
                          per_book.append({home: fair[0], away: fair[1]})
                      for side, price in o.items():
                          if price > best.get(side, 0):
                              best[side] = price
                              best[side + "|book"] = bk.get("key")
                  if not per_book or not best:
                      continue
                  fair_home = C.median([b[home] for b in per_book])
                  fair_away = 1.0 - fair_home
                  sel = home if fair_home >= fair_away else away
                  fp = max(fair_home, fair_away)
                  bp = best.get(sel, 0)
                  if bp <= 1.0:
                      continue
                  dog = away if sel == home else home
                  dog_fp, dog_bp = 1.0 - fp, best.get(dog, 0)
                  picks.append({
                      "matchup": f"{C.TEAMS.get(g['away_id'],('?',))[0]} @ "
                                 f"{C.TEAMS.get(g['home_id'],('?',))[0]}",
                      "game_pk": g["gamePk"], "selection": sel,
                      "sel_abbr": C.TEAMS.get(
                          g["home_id"] if sel == home else g["away_id"], ("?",))[0],
                      "fair": fp, "best_price": bp,
                      "best_book": best.get(sel + "|book", "?"),
                      "n_books": len(per_book),
                      "edge": bp * fp - 1.0,
                      "dog": dog, "dog_edge": (dog_bp * dog_fp - 1.0) if dog_bp else -1,
                      "dog_price": dog_bp, "dog_book": best.get(dog + "|book", "?"),
                      "sp": f"{g['away_sp_name'] or 'TBD'} / {g['home_sp_name'] or 'TBD'}",
                      "start": ev.get("commence_time"),
                  })
              picks.sort(key=lambda p: -p["fair"])
              return picks


          # ================================================================ render

          def edge_threshold(sels):
              """
              Adaptive flag. Book dispersion on home-run props is far wider than on
              moneylines, so a fixed 2% would light up every leg and mean nothing.
              Flag the genuinely wide prices: the day's own 80th percentile, floored
              at 4% so a flat slate doesn't manufacture signal.
              """
              e = sorted(s["best_price"] * s["fair"] - 1 for s in sels if s.get("fair"))
              if not e:
                  return 0.04
              q80 = e[min(len(e) - 1, int(len(e) * 0.80))]
              return max(0.04, q80)


          def tier(p):
              if p >= 0.620:
                  return "STRONG"
              if p >= 0.555:
                  return "LEAN"
              return "COIN FLIP"


          def render(board_date, parlays, mls, sels, credits, graded):
              A, B = [], []
              thr = edge_threshold(sels)
              A.append(f"<b>MLB HOME RUN BOARD — {board_date:%a %d %b %Y}</b>")
              A.append(f"{len(mls)} games · {len(sels)} priced bats · "
                       f"built {datetime.now(timezone.utc):%H:%M} UTC")
              A.append("")
              for name, legs in parlays:
                  price = parlay_price(legs)
                  prob = parlay_prob(legs)
                  A.append(f"<b>━━ {name} · {len(legs)} legs ━━</b>")
                  for s in legs:
                      star = " ⚡" if s["best_price"] * s["fair"] - 1 > thr else ""
                      est = "~" if s["fair_estimated"] else ""
                      A.append(f"• <b>{s['player']}</b> ({s['team']}) — {s['matchup']}")
                      A.append(f"  {s['best_price']:.2f} ({C.american(s['best_price'])}) "
                               f"{s['best_book']} · fair {est}{s['fair']*100:.1f}% · "
                               f"model {s['model']*100:.1f}%{star}")
                      A.append(f"  vs {s['opp_sp']} · park {s['park']}")
                  A.append(f"  <b>Combined {price:.2f} ({C.american(price)})</b> · "
                           f"hit chance {prob*100:.2f}%")
                  A.append("")
              A.append(f"<i>Legs ranked by consensus hit probability, never two from "
                       f"the same game. ⚡ = best price beats consensus fair value by "
                       f"more than {thr*100:.0f}% — the widest prices on the slate. "
                       f"~ = fair value estimated from one-sided books.</i>")

              B.append(f"<b>MONEYLINE — every game, {board_date:%a %d %b}</b>")
              B.append("")
              for m in mls:
                  star = " ⚡" if m["edge"] > 0.02 else ""
                  B.append(f"<b>{m['sel_abbr']}</b>  {m['matchup']}  "
                           f"{m['best_price']:.2f} ({C.american(m['best_price'])}) "
                           f"{m['best_book']}{star}")
                  B.append(f"   fair {m['fair']*100:.1f}% · {tier(m['fair'])} · "
                           f"{m['sp']}")
                  if m["dog_edge"] > 0.02:
                      B.append(f"   ↳ price edge on the dog: {m['dog']} "
                               f"{m['dog_price']:.2f} ({m['dog_book']}) "
                               f"{m['dog_edge']*100:+.1f}%")
              B.append("")
              if graded:
                  B.append(f"<b>Yesterday:</b> {graded}")
              B.append(f"<i>Consensus of {max((m['n_books'] for m in mls), default=0)} "
                       f"books, Shin de-vigged, best available price shown. "
                       f"⚡ = best price beats fair value — the only edge the football "
                       f"backtest ever found. Credits left: {credits}.</i>")
              return "\n".join(A), "\n".join(B)


          def discover_chat_id(token):
              """
              Telegram will not let a bot message you until you have messaged it first,
              and the chat id is not shown anywhere in the app. This reads it off the
              bot's own update feed so the first run can tell you what to paste.
              """
              import requests
              try:
                  r = requests.get(f"https://api.telegram.org/bot{token}/getUpdates",
                                   timeout=30)
                  ids = []
                  for u in (r.json().get("result") or []):
                      for k in ("message", "channel_post", "edited_message"):
                          c = (u.get(k) or {}).get("chat") or {}
                          if c.get("id") and c["id"] not in [i for i, _ in ids]:
                              ids.append((c["id"],
                                          c.get("title") or c.get("username")
                                          or c.get("first_name") or "?"))
                  return ids
              except Exception as e:
                  print(f"  getUpdates failed: {e}")
                  return []


          def telegram(token, chat_id, text):
              import requests
              r = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": chat_id, "text": text,
                        "parse_mode": "HTML", "disable_web_page_preview": True},
                  timeout=45,
              )
              ok = r.status_code == 200 and r.json().get("ok")
              print(f"  telegram HTTP {r.status_code} ok={ok}")
              if not ok:
                  print(f"  telegram body: {r.text[:400]}")
              return ok, r.status_code, r.text[:400]


          # ================================================================ grading

          STALE_DAYS = 5


          def grade_previous(board_date):
              """
              Settle everything logged on an earlier board.

              A scratched hitter never appears in the boxscore at all. Books void a
              home-run prop when the player takes no plate appearance, so that is what
              gets recorded — treating it as a loss would quietly understate the hit
              rate, and leaving it blank would re-fetch the same boxscore every day
              forever.
              """
              rows = C.read_csv(PICKS)
              today = board_date.isoformat()
              todo = [r for r in rows if not r.get("result")
                      and r.get("board_date") and r["board_date"] != today]
              if not todo:
                  return "", rows, False

              finals = {}
              for d in sorted({r["board_date"] for r in todo}):
                  for g in F.schedule(d):
                      finals[str(g["gamePk"])] = g

              want_box = {r["game_pk"] for r in todo if r["market"] == "HR"
                          and finals.get(r["game_pk"], {}).get("state") == "Final"}
              boxes = {}
              for pk in sorted(want_box):
                  b = F.boxscore_hr(int(pk))
                  if b is not None:
                      boxes[pk] = {str(k): v for k, v in b.items()}

              hit = tot = ml_hit = ml_tot = void = 0
              changed = False
              for r in rows:
                  if r.get("result") or not r.get("board_date") or r["board_date"] == today:
                      continue
                  pk = r.get("game_pk")
                  g = finals.get(pk)
                  stale = (board_date - C.date_from_iso(r["board_date"])).days > STALE_DAYS

                  if not g or g.get("state") != "Final":
                      if stale:                       # postponed or never played
                          r["result"] = "VOID"
                          changed = True
                          void += 1
                      continue

                  if r["market"] == "HR":
                      box = boxes.get(pk)
                      if box is None:
                          if stale:
                              r["result"] = "VOID"
                              changed = True
                              void += 1
                          continue
                      n = box.get(str(r.get("selection_id") or ""))
                      if n is None:                   # did not bat -> book voids it
                          r["result"] = "VOID"
                          void += 1
                      else:
                          r["result"] = "WIN" if n >= 1 else "LOSS"
                          tot += 1
                          hit += 1 if n >= 1 else 0
                      changed = True
                  else:
                      if g.get("home_score") is None:
                          continue
                      winner = (C.TEAMS.get(g["home_id"], ("?",))[0]
                                if g["home_score"] > g["away_score"]
                                else C.TEAMS.get(g["away_id"], ("?",))[0])
                      r["result"] = "WIN" if r.get("team") == winner else "LOSS"
                      changed = True
                      ml_tot += 1
                      ml_hit += 1 if r["result"] == "WIN" else 0

              bits = []
              if tot:
                  bits.append(f"HR legs {hit}/{tot}")
              if ml_tot:
                  bits.append(f"moneylines {ml_hit}/{ml_tot} ({ml_hit/ml_tot*100:.0f}%)")
              if void:
                  bits.append(f"{void} void")
              return " · ".join(bits), rows, changed


          # ================================================================ main

          def main():
              token = os.environ.get("TELEGRAM_TOKEN", "").strip()
              chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
              api = os.environ.get("ODDS_API_KEY", "").strip()
              if not api:
                  print("FATAL: ODDS_API_KEY is not set")
