name: daily-board

# Builds the matchday board and sends the summary to Telegram.
# Runs after daily-fetch has committed fresh odds.

on:
  schedule:
    # 10:00 UTC = 18:00 Singapore
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pandas numpy scipy pyarrow requests

      - name: Write the model
        run: |
          mkdir -p soccer-model/model data
          cat > soccer-model/model/__init__.py <<'PY_EOF___INIT___PY'

          PY_EOF___INIT___PY
          cat > soccer-model/model/dc.py <<'PY_EOF_DC_PY'
          """
          Time-decayed Dixon-Coles with a shared attack/defence pool across a country's
          divisions, so a promoted or relegated club carries its rating with it.

          For one "system" (a country's pyramid):

              log lam_home = mu[d] + hfa[d] + att[i] - dfn[j]
              log lam_away = mu[d]          + att[j] - dfn[i]

          with the Dixon-Coles tau correction on the four lowest scorelines, an
          exponential time-decay weight on each historical match, and a ridge penalty on
          att/dfn that both fixes identifiability and does the shrinkage: a club with
          eight matches of history gets pulled most of the way to its division's mean.

          Fitted by L-BFGS-B with an analytic gradient - fast enough to refit inside a
          walk-forward backtest a thousand times over.
          """
          from __future__ import annotations

          import numpy as np
          from scipy.optimize import minimize
          from scipy.special import gammaln

          MAXGOALS = 10


          # ---------------------------------------------------------------------------
          # tau: the Dixon-Coles low-score correction
          # ---------------------------------------------------------------------------

          def _tau_parts(x, y, lh, la, rho):
              """tau and its partials, evaluated only where it isn't 1."""
              tau = np.ones_like(lh)
              dl_h = np.zeros_like(lh)   # d log tau / d lam_home
              dl_a = np.zeros_like(lh)
              dl_r = np.zeros_like(lh)   # d log tau / d rho

              m00 = (x == 0) & (y == 0)
              m01 = (x == 0) & (y == 1)
              m10 = (x == 1) & (y == 0)
              m11 = (x == 1) & (y == 1)

              if m00.any():
                  t = 1.0 - lh[m00] * la[m00] * rho
                  tau[m00] = t
                  dl_h[m00] = -la[m00] * rho / t
                  dl_a[m00] = -lh[m00] * rho / t
                  dl_r[m00] = -lh[m00] * la[m00] / t
              if m01.any():
                  t = 1.0 + lh[m01] * rho
                  tau[m01] = t
                  dl_h[m01] = rho / t
                  dl_r[m01] = lh[m01] / t
              if m10.any():
                  t = 1.0 + la[m10] * rho
                  tau[m10] = t
                  dl_a[m10] = rho / t
                  dl_r[m10] = la[m10] / t
              if m11.any():
                  t = 1.0 - rho
                  tau[m11] = t
                  dl_r[m11] = -1.0 / t
              return tau, dl_h, dl_a, dl_r


          # ---------------------------------------------------------------------------

          class DixonColes:
              def __init__(self, ridge: float = 0.02, rho_bound: float = 0.18,
                           fix_rho: float | None = None):
                  """
                  fix_rho: pin the low-score correction instead of estimating it. Needed
                  when the response is a continuous goals/xG blend - tau's masks are
                  defined on integer scorelines, so it can only be estimated from real
                  goals. Fit rho once on goals, then pass it here.
                  """
                  self.ridge = ridge
                  self.rho_bound = rho_bound
                  self.fix_rho = fix_rho

              # -- packing -----------------------------------------------------------
              def _unpack(self, p):
                  n, d = self.n_teams, self.n_divs
                  att = p[:n]
                  dfn = p[n:2 * n]
                  mu = p[2 * n:2 * n + d]
                  hfa = p[2 * n + d:2 * n + 2 * d]
                  rho = p[-1]
                  return att, dfn, mu, hfa, rho

              # -- objective ---------------------------------------------------------
              def _nll(self, p):
                  att, dfn, mu, hfa, rho = self._unpack(p)
                  hi, ai, di, x, y, w = self.hi, self.ai, self.di, self.x, self.y, self.w

                  log_lh = mu[di] + hfa[di] + att[hi] - dfn[ai]
                  log_la = mu[di] + att[ai] - dfn[hi]
                  lh, la = np.exp(log_lh), np.exp(log_la)

                  tau, dl_h, dl_a, dl_r = _tau_parts(x, y, lh, la, rho)
                  if np.any(tau <= 1e-9):
                      return 1e12, np.zeros_like(p)

                  ll = w * (np.log(tau) + x * log_lh - lh + y * log_la - la)
                  nll = -ll.sum() + self.ridge * (att @ att + dfn @ dfn)

                  # gradient
                  gh = w * ((x - lh) + lh * dl_h)     # d/d log_lam_home
                  ga = w * ((y - la) + la * dl_a)

                  n, d = self.n_teams, self.n_divs
                  g_att = np.bincount(hi, gh, n) + np.bincount(ai, ga, n)
                  g_dfn = -(np.bincount(ai, gh, n) + np.bincount(hi, ga, n))
                  g_mu = np.bincount(di, gh + ga, d)
                  g_hfa = np.bincount(di, gh, d)
                  g_rho = float((w * dl_r).sum())

                  grad = np.concatenate([
                      -g_att + 2 * self.ridge * att,
                      -g_dfn + 2 * self.ridge * dfn,
                      -g_mu, -g_hfa, [-g_rho],
                  ])
                  return nll, grad

              # -- fit ---------------------------------------------------------------
              def fit(self, home_idx, away_idx, div_idx, hg, ag, weights,
                      n_teams, n_divs, x0=None):
                  self.hi = np.ascontiguousarray(home_idx, dtype=np.intp)
                  self.ai = np.ascontiguousarray(away_idx, dtype=np.intp)
                  self.di = np.ascontiguousarray(div_idx, dtype=np.intp)
                  self.x = np.ascontiguousarray(hg, dtype=float)
                  self.y = np.ascontiguousarray(ag, dtype=float)
                  self.w = np.ascontiguousarray(weights, dtype=float)
                  self.n_teams, self.n_divs = n_teams, n_divs

                  if x0 is None:
                      x0 = np.concatenate([
                          np.zeros(n_teams), np.zeros(n_teams),
                          np.full(n_divs, np.log(1.35)), np.full(n_divs, 0.25), [0.0],
                      ])
                  if self.fix_rho is None:
                      rb = (-self.rho_bound, self.rho_bound)
                  else:
                      rb = (self.fix_rho, self.fix_rho)
                      x0 = np.asarray(x0, dtype=float).copy()
                      x0[-1] = self.fix_rho
                  bounds = ([(-3, 3)] * (2 * n_teams)
                            + [(-2, 2)] * n_divs
                            + [(-1, 1)] * n_divs
                            + [rb])

                  res = minimize(self._nll, x0, jac=True, method="L-BFGS-B",
                                 bounds=bounds, options={"maxiter": 400, "ftol": 1e-10})
                  self.params_ = res.x
                  self.att_, self.dfn_, self.mu_, self.hfa_, self.rho_ = self._unpack(res.x)
                  self.result_ = res
                  return self

              # -- predict -----------------------------------------------------------
              def rates(self, home_idx, away_idx, div_idx):
                  lh = np.exp(self.mu_[div_idx] + self.hfa_[div_idx]
                              + self.att_[home_idx] - self.dfn_[away_idx])
                  la = np.exp(self.mu_[div_idx] + self.att_[away_idx] - self.dfn_[home_idx])
                  return lh, la


          # ---------------------------------------------------------------------------
          # scoreline matrix and everything derived from it
          # ---------------------------------------------------------------------------

          _K = np.arange(MAXGOALS + 1)
          _LOGFACT = gammaln(_K + 1)


          def score_matrix(lh: float, la: float, rho: float, maxgoals: int = MAXGOALS):
              """Joint P(home=x, away=y) as a (maxgoals+1, maxgoals+1) array."""
              k = _K[:maxgoals + 1]
              lf = _LOGFACT[:maxgoals + 1]
              ph = np.exp(-lh + k * np.log(lh) - lf)
              pa = np.exp(-la + k * np.log(la) - lf)
              M = np.outer(ph, pa)
              M[0, 0] *= 1.0 - lh * la * rho
              M[0, 1] *= 1.0 + lh * rho
              M[1, 0] *= 1.0 + la * rho
              M[1, 1] *= 1.0 - rho
              M = np.clip(M, 1e-15, None)
              return M / M.sum()


          def markets(M: np.ndarray) -> dict:
              """Every market we price, read off one matrix."""
              n = M.shape[0]
              gd = np.subtract.outer(np.arange(n), np.arange(n))   # home - away
              tot = np.add.outer(np.arange(n), np.arange(n))

              out = {
                  "home": float(M[gd > 0].sum()),
                  "draw": float(np.trace(M)),
                  "away": float(M[gd < 0].sum()),
                  "btts": float(M[1:, 1:].sum()),
              }
              for line in (0.5, 1.5, 2.5, 3.5, 4.5):
                  out[f"over{line}"] = float(M[tot > line].sum())
                  out[f"under{line}"] = float(M[tot < line].sum())

              # Asian handicaps, home side, including quarter lines.
              for h in (-2.0, -1.75, -1.5, -1.25, -1.0, -0.75, -0.5, -0.25,
                        0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0):
                  out[f"ah{h:+g}"] = ah_prob(M, gd, h)
              return out


          def ah_prob(M, gd, handicap: float) -> dict:
              """Win / push / lose for the home side at an Asian line (quarters split)."""
              if abs(handicap * 4 - round(handicap * 4)) > 1e-9:
                  raise ValueError("handicap must be a multiple of 0.25")
              q = round(handicap * 4)
              if q % 2 != 0:                      # quarter line: half stake on each side
                  lo, hi = (q - 1) / 4.0, (q + 1) / 4.0
                  a, b = ah_prob(M, gd, lo), ah_prob(M, gd, hi)
                  return {k: 0.5 * (a[k] + b[k]) for k in a}
              adj = gd + handicap
              return {"win": float(M[adj > 0].sum()),
                      "push": float(M[np.isclose(adj, 0)].sum()),
                      "lose": float(M[adj < 0].sum())}


          def ah_fair_odds(p: dict) -> float:
              """Fair decimal price for an Asian line, pushes returned not lost."""
              live = p["win"] + p["lose"]
              return float("inf") if live <= 0 or p["win"] <= 0 else 1.0 + (p["lose"] / p["win"])

          PY_EOF_DC_PY
          cat > soccer-model/model/db.py <<'PY_EOF_DB_PY'
          """Load the raw match dump and shape it into fittable systems."""
          from __future__ import annotations

          import numpy as np
          import pandas as pd

          # Divisions that share a promotion/relegation pyramid are fitted together, so a
          # club that goes up or down carries its attack/defence rating across.
          SYSTEMS: dict[str, list[str]] = {
              "ENG": ["E0", "E1", "E2", "E3", "EC"],
              "SCO": ["SC0", "SC1", "SC2", "SC3"],
              "ESP": ["SP1", "SP2"],
              "ITA": ["I1", "I2"],
              "GER": ["D1", "D2"],
              "FRA": ["F1", "F2"],
              "NED": ["N1"],
              "BEL": ["B1"],
              "POR": ["P1"],
              "TUR": ["T1"],
              "GRE": ["G1"],
          }

          DIV_NAMES = {
              "E0": "Premier League", "E1": "Championship", "E2": "League One",
              "E3": "League Two", "EC": "National League",
              "SC0": "Scottish Prem", "SC1": "Scottish Champ", "SC2": "Scottish L1",
              "SC3": "Scottish L2",
              "SP1": "La Liga", "SP2": "La Liga 2", "I1": "Serie A", "I2": "Serie B",
              "D1": "Bundesliga", "D2": "2. Bundesliga", "F1": "Ligue 1", "F2": "Ligue 2",
              "N1": "Eredivisie", "B1": "Belgian Pro", "P1": "Primeira Liga",
              "T1": "Super Lig", "G1": "Super League Greece",
          }

          # 1X2 price columns, best first. C = closing.
          CLOSE_1X2 = [("PSCH", "PSCD", "PSCA"), ("MaxCH", "MaxCD", "MaxCA"),
                       ("AvgCH", "AvgCD", "AvgCA"), ("B365CH", "B365CD", "B365CA")]
          OPEN_1X2 = [("MaxH", "MaxD", "MaxA"), ("PSH", "PSD", "PSA"),
                      ("B365H", "B365D", "B365A"), ("AvgH", "AvgD", "AvgA")]


          def load(path="data/matches.parquet") -> pd.DataFrame:
              df = pd.read_parquet(path)
              df = df[df["date"].notna()].copy()
              df["Div"] = df["Div"].astype(str)
              for c in ("HomeTeam", "AwayTeam"):
                  df[c] = df[c].astype(str).str.strip()
              df["FTHG"] = df["FTHG"].astype(int)
              df["FTAG"] = df["FTAG"].astype(int)
              df["system"] = df["Div"].map({d: s for s, ds in SYSTEMS.items() for d in ds})

              # Extra-league divisions arrive as "ARG: Liga Profesional". Everything from
              # one country is one system, so clubs moving between a league and its cup
              # competition keep a single rating.
              extra = df["system"].isna() & df["Div"].str.contains(":", regex=False)
              df.loc[extra, "system"] = df.loc[extra, "Div"].str.split(":").str[0].str.strip()
              return df.sort_values("date").reset_index(drop=True)


          def first_available(df: pd.DataFrame, groups) -> tuple[np.ndarray, np.ndarray]:
              """Pick, per row, the first price triple whose three columns are all present."""
              out = np.full((len(df), 3), np.nan)
              which = np.full(len(df), -1)
              for gi, cols in enumerate(groups):
                  if not all(c in df.columns for c in cols):
                      continue
                  vals = df[list(cols)].to_numpy(dtype=float)
                  ok = np.isfinite(vals).all(axis=1) & (vals > 1.0).all(axis=1) & (which < 0)
                  out[ok] = vals[ok]
                  which[ok] = gi
              return out, which


          def devig_shin(odds: np.ndarray, iters: int = 60) -> np.ndarray:
              """
              Shin (1993) de-vig. Assumes the overround comes from a proportion z of
              insider money, which removes more margin from longshots than from
              favourites - the right shape for football, where the naive proportional
              method leaves draws and away sides systematically overpriced.
              """
              q = 1.0 / odds
              s = q.sum(axis=1, keepdims=True)
              z = np.clip((s - 1.0) / 2.0, 0.0, 0.35)
              for _ in range(iters):
                  root = np.sqrt(z ** 2 + 4 * (1 - z) * q ** 2 / s)
                  p = (root - z) / (2 * (1 - z))
                  tot = p.sum(axis=1, keepdims=True)
                  z = np.clip(z + 0.55 * (tot - 1.0), 0.0, 0.35)
              root = np.sqrt(z ** 2 + 4 * (1 - z) * q ** 2 / s)
              p = (root - z) / (2 * (1 - z))
              return p / p.sum(axis=1, keepdims=True)


          def devig_proportional(odds: np.ndarray) -> np.ndarray:
              q = 1.0 / odds
              return q / q.sum(axis=1, keepdims=True)


          class SystemData:
              """Integer-indexed view of one pyramid, ready to hand to DixonColes."""

              def __init__(self, df: pd.DataFrame):
                  # keep a handle on the caller's row labels so predictions can be joined
                  # back to the full table for odds
                  self.orig_index = df.index.to_numpy()
                  self.df = df.reset_index(drop=True)
                  teams = pd.Index(sorted(set(self.df.HomeTeam) | set(self.df.AwayTeam)))
                  divs = pd.Index(sorted(self.df.Div.unique()))
                  self.teams, self.divs = teams, divs
                  self.hi = teams.get_indexer(self.df.HomeTeam).astype(np.intp)
                  self.ai = teams.get_indexer(self.df.AwayTeam).astype(np.intp)
                  self.di = divs.get_indexer(self.df.Div).astype(np.intp)
                  self.hg = self.df.FTHG.to_numpy(float)
                  self.ag = self.df.FTAG.to_numpy(float)
                  self.dates = self.df["date"].to_numpy("datetime64[D]")

                  # shot counts - the raw material for a chance-quality proxy
                  def col(c):
                      return (self.df[c].to_numpy(float) if c in self.df.columns
                              else np.full(len(self.df), np.nan))
                  self.hs, self.as_ = col("HS"), col("AS")
                  self.hst, self.ast = col("HST"), col("AST")
                  self.has_shots = (np.isfinite(self.hs) & np.isfinite(self.as_)
                                    & np.isfinite(self.hst) & np.isfinite(self.ast))

              def chance_quality(self, train_mask: np.ndarray, weight: float
                                 ) -> tuple[np.ndarray, np.ndarray]:
                  """
                  A cheap stand-in for xG, fitted only on matches the model is allowed
                  to see: goals ~ a*(on target) + b*(off target), by least squares, then
                  blended with actual goals.

                  It is cruder than real xG - no shot locations, no chance quality - but
                  it separates chances created from finishing, which is the whole reason
                  xG predicts better than goals do. If this moves nothing, real xG very
                  likely wouldn't either.
                  """
                  m = train_mask & self.has_shots
                  if m.sum() < 200 or weight <= 0:
                      return self.hg.copy(), self.ag.copy()

                  # stack home and away rows into one regression
                  on = np.concatenate([self.hst[m], self.ast[m]])
                  off = np.concatenate([self.hs[m] - self.hst[m], self.as_[m] - self.ast[m]])
                  y = np.concatenate([self.hg[m], self.ag[m]])
                  X = np.column_stack([on, off])
                  coef, *_ = np.linalg.lstsq(X, y, rcond=None)
                  a, b = float(coef[0]), float(coef[1])

                  ph = a * self.hst + b * (self.hs - self.hst)
                  pa = a * self.ast + b * (self.as_ - self.ast)
                  ph = np.clip(ph, 0.02, 8.0)
                  pa = np.clip(pa, 0.02, 8.0)
                  use = self.has_shots
                  return (np.where(use, weight * ph + (1 - weight) * self.hg, self.hg),
                          np.where(use, weight * pa + (1 - weight) * self.ag, self.ag))

              def weights(self, asof: np.datetime64, half_life_days: float) -> np.ndarray:
                  age = (asof - self.dates).astype("timedelta64[D]").astype(float)
                  xi = np.log(2.0) / half_life_days
                  return np.exp(-xi * np.maximum(age, 0.0))

              def appearances(self, mask: np.ndarray) -> np.ndarray:
                  """Matches played per team within `mask` - drives the confidence gate."""
                  n = len(self.teams)
                  return np.bincount(self.hi[mask], minlength=n) + np.bincount(self.ai[mask], minlength=n)

          PY_EOF_DB_PY
          cat > soccer-model/model/live.py <<'PY_EOF_LIVE_PY'
          """Turn today's odds feed into priced fixtures."""
          from __future__ import annotations

          import re
          import unicodedata
          import numpy as np
          import pandas as pd
          from scipy.special import gammaln

          SPORT_TO_DIV = {
              "soccer_epl": "E0", "soccer_efl_champ": "E1",
              "soccer_england_league1": "E2", "soccer_england_league2": "E3",
              "soccer_spain_la_liga": "SP1", "soccer_spain_segunda_division": "SP2",
              "soccer_italy_serie_a": "I1", "soccer_italy_serie_b": "I2",
              "soccer_germany_bundesliga": "D1", "soccer_germany_bundesliga2": "D2",
              "soccer_france_ligue_one": "F1", "soccer_france_ligue_two": "F2",
              "soccer_netherlands_eredivisie": "N1", "soccer_belgium_first_div": "B1",
              "soccer_portugal_primeira_liga": "P1", "soccer_turkey_super_league": "T1",
              "soccer_greece_super_league": "G1",
              "soccer_brazil_campeonato": "BRA: Serie A",
              "soccer_usa_mls": "USA: MLS", "soccer_mexico_ligamx": "MEX: Liga MX",
              "soccer_japan_j_league": "JAP: J1 League",
              "soccer_argentina_primera_division": "ARG: Liga Profesional",
          }

          _NOISE = re.compile(r"\b(fc|cf|afc|ac|as|ss|ssc|sc|cd|ud|rcd|club|calcio|"
                              r"football|deportivo|de|the|united|city|town|athletic|"
                              r"wanderers|rovers|albion|county|hotspur)\b")


          def norm(s: str, strip_noise: bool = True) -> str:
              s = unicodedata.normalize("NFKD", str(s))
              s = "".join(c for c in s if not unicodedata.combining(c)).lower()
              s = re.sub(r"[^a-z0-9 ]", " ", s)
              if strip_noise:
                  s = _NOISE.sub(" ", s)
              return re.sub(r"\s+", " ", s).strip()


          def _acronym(s: str) -> str:
              return "".join(w[0] for w in norm(s, False).split() if w)


          def _score(a: str, b: str) -> float:
              from difflib import SequenceMatcher
              fa, fb = norm(a, False), norm(b, False)
              na, nb = norm(a), norm(b)
              if fa == fb:
                  return 3.0
              if na and na == nb:
                  return 2.5
              # football-data abbreviates: "QPR" for Queens Park Rangers, "Sp Gijon"
              if fa.replace(" ", "") == _acronym(b) or fb.replace(" ", "") == _acronym(a):
                  return 2.4
              ta, tb = set(na.split()), set(nb.split())
              if not ta or not tb:
                  return 0.0
              jac = len(ta & tb) / len(ta | tb)
              # one name being a prefix of the other is the common case:
              # "Wolverhampton Wanderers" vs "Wolves", "Newcastle United" vs "Newcastle"
              pre = 0.6 if (fa.startswith(fb[:5]) or fb.startswith(fa[:5])) else 0.0
              sub = 0.5 if (na and nb and (na in nb or nb in na)) else 0.0
              # character-level similarity catches the contractions football-data likes:
              # "Nott'm Forest", "M'gladbach", "Ein Frankfurt"
              chars = SequenceMatcher(None, fa, fb).ratio()
              # ...and compare the distinctive words directly, so "Monchengladbach"
              # still finds "M'gladbach" even with "Borussia" padding one side out
              tok = 0.0
              for wa in (w for w in fa.split() if len(w) >= 5):
                  for wb in (w for w in fb.split() if len(w) >= 5):
                      tok = max(tok, SequenceMatcher(None, wa, wb).ratio())
              # a close match on the distinctive word is strong evidence by itself:
              # "Monchengladbach" vs "gladbach" is the same club and nothing else in the
              # division comes near it
              tok_bonus = 0.6 if tok >= 0.65 else 0.0
              return (jac + pre + sub + 1.2 * max(0.0, chars - 0.35)
                      + 1.0 * max(0.0, tok - 0.55) + tok_bonus)


          def map_teams(feed_names: list[str], candidates: list[str],
                        min_score: float = 0.5) -> tuple[dict, list]:
              """
              Greedy 1:1 assignment - each feed name takes its best free candidate,
              strongest pairs first, so a confident match can't be stolen by a weak one.
              """
              pairs = sorted(((_score(f, c), f, c) for f in feed_names for c in candidates),
                             key=lambda t: -t[0])
              used_f, used_c, out = set(), set(), {}
              for sc, f, c in pairs:
                  if sc < min_score or f in used_f or c in used_c:
                      continue
                  out[f] = c
                  used_f.add(f); used_c.add(c)
              return out, [f for f in feed_names if f not in out]


          # ---------------------------------------------------------------------------
          # consensus fair prices from many books
          # ---------------------------------------------------------------------------

          def devig_shin_row(odds: np.ndarray, iters: int = 60) -> np.ndarray:
              q = 1.0 / odds
              s = q.sum()
              z = float(np.clip((s - 1.0) / 2.0, 0.0, 0.35))
              for _ in range(iters):
                  root = np.sqrt(z ** 2 + 4 * (1 - z) * q ** 2 / s)
                  p = (root - z) / (2 * (1 - z))
                  z = float(np.clip(z + 0.55 * (p.sum() - 1.0), 0.0, 0.35))
              root = np.sqrt(z ** 2 + 4 * (1 - z) * q ** 2 / s)
              p = (root - z) / (2 * (1 - z))
              return p / p.sum()


          def consensus_1x2(g: pd.DataFrame, home: str, away: str):
              """Median de-vigged view across books, plus the best price on each side."""
              rows, best = [], {"home": (0, None), "draw": (0, None), "away": (0, None)}
              for book, gb in g[g.market == "h2h"].groupby("book"):
                  px = {}
                  for _, r in gb.iterrows():
                      if r.outcome == home:
                          px["home"] = r.price
                      elif r.outcome == away:
                          px["away"] = r.price
                      elif str(r.outcome).lower() == "draw":
                          px["draw"] = r.price
                  if len(px) != 3 or min(px.values()) <= 1.0:
                      continue
                  rows.append(devig_shin_row(np.array([px["home"], px["draw"], px["away"]])))
                  for k in ("home", "draw", "away"):
                      if px[k] > best[k][0]:
                          best[k] = (px[k], book)
              if not rows:
                  return None, best, 0
              fair = np.median(np.vstack(rows), axis=0)
              return fair / fair.sum(), best, len(rows)


          def consensus_totals(g: pd.DataFrame):
              """{line: (fair_over, best_over_price, book, best_under_price, book)}"""
              out = {}
              t = g[g.market == "totals"]
              for line, gl in t.groupby("point"):
                  rows, bo, bu = [], (0, None), (0, None)
                  for book, gb in gl.groupby("book"):
                      o = gb[gb.outcome.str.lower() == "over"].price
                      u = gb[gb.outcome.str.lower() == "under"].price
                      if not len(o) or not len(u):
                          continue
                      o, u = float(o.iloc[0]), float(u.iloc[0])
                      if o <= 1 or u <= 1:
                          continue
                      rows.append(devig_shin_row(np.array([o, u])))
                      if o > bo[0]:
                          bo = (o, book)
                      if u > bu[0]:
                          bu = (u, book)
                  if rows:
                      fair = np.median(np.vstack(rows), axis=0)
                      fair = fair / fair.sum()
                      out[float(line)] = (float(fair[0]), bo, bu, len(rows))
              return out


          # ---------------------------------------------------------------------------
          # the scoreline matrix the market itself implies
          # ---------------------------------------------------------------------------

          MAX = 10
          _K = np.arange(MAX + 1)
          _LF = gammaln(_K + 1)


          def _poisson_matrix(lh: float, la: float) -> np.ndarray:
              ph = np.exp(-lh + _K * np.log(lh) - _LF)
              pa = np.exp(-la + _K * np.log(la) - _LF)
              M = np.outer(ph, pa)
              return M / M.sum()


          def _p_over(T: float, line: float) -> float:
              n = int(np.floor(line))
              k = np.arange(n + 1)
              return float(1.0 - np.exp(-T + k * np.log(T) - gammaln(k + 1)).sum())


          def implied_matrix(fair_1x2, totals, rho: float = -0.03) -> np.ndarray | None:
              """
              Books build correct-score off a supremacy and a total. So do we - it beat
              our own model on real scorelines by a clear margin, so this is the better
              shape to price from.
              """
              if fair_1x2 is None:
                  return None
              # total: prefer the 2.5 line, else whichever is closest to it
              if totals:
                  line = min(totals, key=lambda L: abs(L - 2.5))
                  target_over = totals[line][0]
                  lo, hi = 0.05, 9.0
                  for _ in range(80):
                      mid = (lo + hi) / 2
                      if _p_over(mid, line) < target_over:
                          lo = mid
                      else:
                          hi = mid
                  T = (lo + hi) / 2
              else:
                  T = 2.6
              target = fair_1x2[0] - fair_1x2[2]
              lo, hi = -T * 0.95, T * 0.95
              for _ in range(60):
                  mid = (lo + hi) / 2
                  M = _poisson_matrix(max((T + mid) / 2, 1e-6), max((T - mid) / 2, 1e-6))
                  gd = np.subtract.outer(_K, _K)
                  if float(M[gd > 0].sum() - M[gd < 0].sum()) < target:
                      lo = mid
                  else:
                      hi = mid
              S = (lo + hi) / 2
              lh, la = max((T + S) / 2, 1e-6), max((T - S) / 2, 1e-6)
              M = _poisson_matrix(lh, la)
              M[0, 0] *= 1 - lh * la * rho
              M[0, 1] *= 1 + lh * rho
              M[1, 0] *= 1 + la * rho
              M[1, 1] *= 1 - rho
              M = np.clip(M, 1e-15, None)
              return M / M.sum()

